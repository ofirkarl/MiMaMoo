<title>MiMaMoo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* One light look, always: near-white lilac ground, white cards, and five pastels of equal softness —
   butter (act), mint (done), sky (mine), lavender (selected), peach (careful) — each with a deep partner for text. */
:root{
  color-scheme:light;
  --bg:#FAF9FC; --surface:#FFFFFF; --sunk:#F3F1F8; --line:#ECE9F3; --line-2:#DCD7E6;
  --ink:#2B2833; --muted:#77728A;
  /* Palette — neutrals for surfaces and text; butter = anything you press or have chosen;
     lavender = personal ("me", private) and multi-select; mint = done; coral = delete or debt. */
  --accent:#FFE08F; --accent-ink:#5A4410; --accent-soft:#FFF5D6; --accent-line:#F2D27A; --accent-deep:#9A6A08;
  --good:#2E7D5B; --good-bg:#E3F6EC; --good-fill:#A6DEC3;
  --sel-bg:#F0ECFF; --sel-line:#CFC5F7; --sel-ink:#5A4BB8;
  --mine-bg:var(--sel-bg); --mine-line:var(--sel-line); --mine-ink:var(--sel-ink);
  --danger:#B4533C; --danger-bg:#FFEDE6;
  --ring:#A497F2; --link:#5A4BB8;
  --t-base:linear-gradient(160deg,#FFFFFF 0%,#F4F0FD 100%); --t-base-ink:#2B2833;
  --t-forest:linear-gradient(150deg,#EEFAF4,#D9F2E6); --t-forest-ink:#24614A;
  --t-lake:linear-gradient(150deg,#EEF4FF,#DAE7FD); --t-lake-ink:#2E548F;
  --t-sand:linear-gradient(150deg,#FFF9E6,#FFEDBF); --t-sand-ink:#5E4813;
  --t-sunset:linear-gradient(150deg,#FFF1EB,#FDE0E3); --t-sunset-ink:#8A3E2E;
  --t-night:linear-gradient(150deg,#F5F2FF,#E6E0FD); --t-night-ink:#4C3D9E;
  --t-stone:linear-gradient(150deg,#F7F8FA,#E8ECF0); --t-stone-ink:#3D4752;
  --scrim:rgba(43,40,51,.22);
  --shadow-sm:0 1px 2px rgba(60,52,90,.04),0 4px 16px -8px rgba(60,52,90,.14);
  --shadow:0 2px 4px rgba(60,52,90,.04),0 14px 34px -14px rgba(60,52,90,.22);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --f-display:"Fredoka","Rubik","Arial Hebrew",Arial,sans-serif;
  --f-body:"Assistant","Arial Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
#app{overflow-x:clip}
.board,.home{touch-action:pan-y pinch-zoom}
body{direction:rtl;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.noscroll{overflow:hidden}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--ring);outline-offset:2px;border-radius:8px}
[data-lp],[data-sel]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Multi-select: long-press a row, a round check slides in from the right of every row in that list */
[data-sel]{position:relative;transition:padding .24s cubic-bezier(.2,.8,.2,1),background-color .15s,box-shadow .15s}
.selectable{padding-inline-start:calc(var(--pis,0px) + 40px)!important}
.selbox{position:absolute;inset-inline-start:calc(var(--pis,0px) + 4px);top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:transparent;opacity:0;transform:translateX(16px) scale(.5);transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.2,1),background-color .15s,border-color .15s;pointer-events:none}
.selbox svg{width:14px;height:14px}
.item>.selbox{top:13px;margin-top:0}
.selectable>.selbox{opacity:1;transform:none}
.selected>.selbox{background:var(--link);border-color:var(--link);color:#FFFFFF}
.item.selected,.row.selected{background-color:var(--sel-bg);border-radius:12px}
.trip-card.selected,.tpl-row.selected{box-shadow:0 0 0 2px var(--sel-line),var(--shadow-sm)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -12px rgba(60,52,90,.28);transform:translateY(115%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.selbar.show{transform:none}
.trip-card[data-sel],.tpl-row[data-sel],.row[data-sel]{transition:padding .32s cubic-bezier(.2,.8,.2,1),transform .12s,box-shadow .15s,background-color .15s;transition-delay:var(--d,0ms)}
[data-sel]>.selbox{transition-delay:var(--d,0ms)}
/* Rows keep their height while the check column opens: single-line text that truncates, and the chevron folds away */
.trip-card :is(.trip-name,.trip-meta,.trip-when),.tpl-row :is(b,small),.row[data-sel] .row-main :is(b,small){display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-sel] .chev{max-width:40px;overflow:hidden;transition:max-width .3s cubic-bezier(.2,.8,.2,1),opacity .2s,padding .3s}
.selectable .chev{max-width:0;opacity:0;padding:0}
.top-acts{display:flex;align-items:center;gap:8px}
.arch .trip-card.past{opacity:1}
.arch-sec{margin-top:6px}
#sel-count{flex:1;font-weight:700;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.display{font-family:var(--f-display);font-weight:600;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.label,.eyebrow,.sub-label{font-family:var(--f-display);font-weight:500;font-size:14px;line-height:1.25;color:var(--muted)}
.muted{color:var(--muted)}
.pad{padding:12px 0}
.ask{color:var(--link);font-weight:700}

/* Logo */
.logo{display:inline-flex;align-items:center;gap:9px;direction:ltr;unicode-bidi:isolate}
.logo-ic{width:36px;height:36px;flex:none;filter:drop-shadow(0 2px 6px rgba(60,52,90,.12))}
.logo-word{font-family:"Fredoka",var(--f-display);font-weight:600;font-size:25px;letter-spacing:-.02em;line-height:1}
.logo-text{display:flex;flex-direction:column;gap:3px}
.logo-tag{font-family:var(--f-display);font-weight:500;font-size:12.5px;line-height:1;letter-spacing:.04em;color:var(--accent-deep);text-align:left}
/* home: a soft pastel wash behind the lists (butter, mint and lavender, like the logo) */
body.on-home{background-color:#F8F4FD;background-image:radial-gradient(34rem 24rem at 108% -4rem,#FFE6A3 0%,rgba(255,230,163,0) 70%),radial-gradient(28rem 24rem at -10rem 12rem,#CDEFDC 0%,rgba(205,239,220,0) 68%),radial-gradient(34rem 28rem at 100% 34rem,#E0D5FF 0%,rgba(224,213,255,0) 68%),radial-gradient(30rem 24rem at -6rem 56rem,#FFDCCB 0%,rgba(255,220,203,0) 68%);background-repeat:no-repeat;background-attachment:fixed}
body.on-home .top{background:transparent}
body.on-home .empty{background:rgba(255,255,255,.6)}

/* Buttons. One filled butter button per place, the main action; the rest are quieter:
   tonal butter (an action that belongs to a row), soft grey (secondary), bare text (cancel), coral (delete).
   Navigation and tools are round icon buttons of frosted white. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15.5px;line-height:1;border:0;background:var(--sunk);color:var(--ink);white-space:nowrap;transition:transform .14s cubic-bezier(.3,.7,.4,1.6),background .15s,box-shadow .15s,color .15s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 rgba(154,106,8,.13),0 6px 14px -8px rgba(154,106,8,.5)}
.btn.tonal{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14.5px}
.btn.danger{color:var(--danger);background:var(--danger-bg)}
.btn.danger.solid{background:var(--danger-bg);color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#FFFFFF}
.link{color:var(--link);font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.back,.round{position:relative;display:inline-grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.84);color:var(--ink);box-shadow:var(--shadow-sm);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .14s cubic-bezier(.3,.7,.4,1.6),background .15s}
.back:active,.round:active{transform:scale(.9)}
.back svg,.round svg{width:20px;height:20px}
.back span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:transform .14s,background .15s}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:active{transform:scale(.9)}

/* Fields */
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1.5px solid transparent;border-radius:var(--r-md);min-height:48px;padding:0 14px;width:100%;min-width:0;transition:border-color .15s,background .15s}
input::placeholder{color:var(--muted);opacity:.9}
input:focus,select:focus{border-color:var(--ring);background:var(--surface);outline:none}
input[type=number]{text-align:center}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field>span,.field>legend{font-weight:700;font-size:14.5px;color:var(--muted);padding:0}
fieldset.field>legend{margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-row{display:flex;flex-wrap:wrap;gap:8px}
.add-row .grow{flex:1 1 100%}
.add-row select{flex:1 1 90px;width:auto}
.add-row .btn{flex:0 0 auto}
@media (min-width:560px){.add-row .grow{flex:1 1 200px}}
.mstep{display:inline-flex;align-items:stretch;flex:0 0 auto;direction:ltr;border:1.5px solid transparent;border-radius:var(--r-md);background:var(--sunk);overflow:hidden;min-height:48px;align-self:flex-start}
.mstep button{width:38px;font-size:21px;font-weight:600;line-height:1;color:var(--ink);display:grid;place-items:center}
.mstep button:active{background:var(--line)}
.mstep input{width:40px;min-width:0;border:0;border-radius:0;background:transparent;padding:0;min-height:0;font-weight:700;-moz-appearance:textfield;appearance:textfield}
.mstep input:focus{background:transparent}
.mstep input::-webkit-outer-spin-button,.mstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mstep:focus-within{border-color:var(--ring)}
.mstep output{width:40px;display:grid;place-items:center;font-weight:700}
.seg,.seg-radio{display:inline-flex;padding:3px;border-radius:999px;background:var(--sunk);gap:2px;align-self:flex-start}
.seg button{min-height:34px;padding:0 14px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.seg-radio label{position:relative}
.tpl-seg{align-self:stretch;display:flex}
.tpl-seg button{flex:1}
.seg-radio input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg-radio span{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg-radio input:checked+span{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.seg-radio input:focus-visible+span{outline:2.5px solid var(--ring)}

/* Top bars */
.top{padding-block:16px 4px;background:var(--bg)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.banner{background:var(--accent-soft);color:var(--ink);font-size:14.5px;font-weight:600}
.banner .wrap{padding-block:9px}

/* Category dot */
.blaze{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);vertical-align:middle}
.blaze.lg{width:14px;height:14px}
.blazes{display:flex;gap:5px;flex-wrap:wrap}

/* Home */
.home,.page{display:flex;flex-direction:column;gap:24px;padding-block:12px 72px}
.home-cols{display:grid;gap:30px}
@media (min-width:900px){.home-cols{grid-template-columns:1fr 1fr;align-items:start}}
.home-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.col-top h2{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.01em}
.trips{display:flex;flex-direction:column;gap:10px}
.trip-card{--pis:12px;display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border-radius:var(--r-lg);padding:12px;padding-inline-end:6px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s}
.trip-card:hover{box-shadow:var(--shadow)}
.trip-card:active{transform:scale(.99)}
.trip-card.past{opacity:.6}
.stub{flex:none;width:58px;height:64px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--sunk);color:var(--ink)}
.solo-card .stub{background:var(--mine-bg);color:var(--mine-ink)}
.shop-card .stub{background:var(--good-bg);color:var(--good)}
.shop-card .stub svg{width:26px;height:26px}
.bought-sec{margin-top:22px;padding-top:12px;border-top:1.5px dashed var(--line-2)}
.bought-head{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:14.5px;color:var(--good);padding-bottom:2px}
.bought-head svg{width:15px;height:15px}
.shop-add{margin-bottom:14px}
.field-hint{font-size:14px;color:var(--muted);margin-top:-8px}
.stub-dow,.stub-mon{font-weight:600;font-size:12px;line-height:1.1;opacity:.75}
.stub-day{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.05;font-variant-numeric:tabular-nums}
.trip-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.trip-when{font-weight:700;font-size:13px;color:var(--accent-deep)}
.trip-name{font-family:var(--f-display);font-weight:600;font-size:18.5px;line-height:1.2;overflow-wrap:anywhere}
.trip-meta{color:var(--muted);font-size:14.5px}
.chev{align-self:center;padding-inline-end:8px;color:var(--line-2);display:flex}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:18px 20px;color:var(--muted)}

/* Banner header of every list */
.trip-head{position:relative;background:var(--hb,var(--t-base));color:var(--hi,var(--t-base-ink));border-radius:0 0 28px 28px;overflow:hidden;box-shadow:var(--shadow-sm)}
.trip-head>.wrap{position:relative;z-index:2;padding-block:10px 16px}
.trip-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.nav-actions{display:flex;gap:8px;flex-wrap:wrap}
.nav-actions .btn{background:rgba(255,255,255,.84);color:var(--ink);box-shadow:var(--shadow-sm);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav-actions .btn.primary{background:var(--accent);color:var(--accent-ink)}
#r-head{position:relative;display:flex;flex-direction:column;gap:3px}
.trip-title{font-size:clamp(27px,7.2vw,40px);color:inherit;overflow-wrap:anywhere}
.trip-head .trip-meta,.trip-head .eyebrow{color:inherit;opacity:.72;font-size:14px}
.trip-head .eyebrow{font-weight:600}
.trip-head.can-cover #r-head>:is(.trip-title,.eyebrow,.trip-meta){padding-inline-end:42px}
/* Participants: one typographic line, names split by soft dots; a wrapped line never starts with a dot */
.crew-line{display:flex;align-items:flex-start;gap:7px;margin-top:6px;max-width:640px;color:var(--accent-deep)}
.trip-head[data-theme="sand"] .crew-line{color:var(--sel-ink)}
.trip-head.has-cover .crew-line{color:#FFFFFF}
.crew-ic{flex:none;display:grid;place-items:center;height:22px;opacity:.55}
.crew-ic svg{width:17px;height:17px}
.crew-box{flex:1;min-width:0;overflow:hidden}
.crew{list-style:none;margin:0;margin-inline-start:-18px;padding:0;display:flex;flex-wrap:wrap;row-gap:1px}
.crew li{white-space:nowrap;font-size:14.5px;font-weight:600;line-height:22px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.crew li>span{opacity:.92;font-weight:700}
.crew li::before{content:"·";display:inline-block;width:18px;text-align:center;font-weight:700;opacity:.4}
.crew li.me>span{opacity:1;font-weight:700}
.jk{display:inline-grid;place-items:center;vertical-align:-2px;margin-inline-start:3px;width:15px;height:15px;border-radius:50%;background:var(--good-fill);color:#1F5A41}
.jk svg{width:10px;height:10px}
.lane-title h3 .jk{width:18px;height:18px;vertical-align:0;margin-inline-start:0}
.lane-title h3 .jk svg{width:12px;height:12px}
.joined-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.joined-list li{display:flex;align-items:center;gap:10px;min-height:38px;font-weight:600;font-size:16px}
.joined-list li>svg{width:22px;height:22px;padding:4px;border-radius:50%;background:var(--good-fill);color:#1F5A41;flex:none}
.joined-list li>i{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line-2);flex:none}
.joined-list li:not(.in)>span{color:var(--muted)}
.joined-list small{margin-inline-start:auto;color:var(--muted);font-size:13.5px;font-weight:500}
/* "X/Y" progress line, just above the list */
.lprog{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.lp-t{display:inline-flex;align-items:center;gap:5px;flex:none;white-space:nowrap}
.lp-t b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.lp-t svg{width:15px;height:15px}
.lp-bar{flex:1;height:5px;border-radius:999px;background:var(--sunk);overflow:hidden}
.lp-bar>i{display:block;height:100%;border-radius:inherit;background:var(--good-fill);transition:width .35s}
.lprog.done{color:var(--good)}
.me-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink);font-size:15px;box-shadow:var(--shadow-sm)}
.me-btn.ask-me{background:var(--accent);color:var(--accent-ink);font-weight:700}
.trip-head.has-cover{background:#D9D3E6 var(--cover) center/cover no-repeat;color:#FFFFFF}
/* a shade rising from the bottom, from clear to 30% see-through, behind the title and the names */
.trip-head.has-cover::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,16,30,0) 0%,rgba(20,16,30,0) 28%,rgba(20,16,30,.16) 48%,rgba(20,16,30,.42) 72%,rgba(20,16,30,.7) 100%)}
.trip-head.has-cover>.wrap{min-height:200px;display:flex;flex-direction:column}
.trip-head.has-cover #r-head{margin-top:auto}
.trip-head.has-cover .trip-title{text-shadow:0 2px 16px rgba(0,0,0,.35)}
.trip-head.has-cover :is(.trip-meta,.eyebrow){opacity:.95}
.trip-head.has-cover :is(.trip-meta,.eyebrow){text-shadow:0 1px 10px rgba(0,0,0,.35)}
.trip-head.has-cover .crew li{text-shadow:0 1px 3px rgba(0,0,0,.45)}
.trip-head.has-cover .crew li>span{opacity:1}
.trip-head.has-cover .crew-ic{opacity:.85}
.trip-head.can-cover>.wrap{pointer-events:none}
.trip-head.can-cover>.wrap :is(button,a,input,select,label){pointer-events:auto}
.cover-hit{position:absolute;inset:0;z-index:1;width:100%;height:100%;min-height:0;padding:0;border:0;border-radius:0;opacity:0;cursor:pointer;font-size:0}
.cover-cam{position:absolute;left:0;top:0;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm);pointer-events:none}
.trip-head.has-cover .cover-cam{background:rgba(0,0,0,.32);color:#FFFFFF;box-shadow:none}

/* Avatars */
.av{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--g);color:#FFFFFF;background:color-mix(in srgb,var(--g) 24%,var(--surface));color:color-mix(in srgb,var(--g) 78%,var(--ink));font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1}
.av.xs{width:22px;height:22px;font-size:12px}
.av.sm{width:28px;height:28px;font-size:13px}
.av.lg{width:42px;height:42px;font-size:18px}
.av.more{background:var(--sunk);color:var(--ink);font-size:12px}

/* Status */
.status-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--muted);font-weight:600}
.status-line .big{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.status-line .big small{font-size:17px;color:var(--muted)}
.status-line.done,.status-line.done .big{color:var(--good)}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good-fill);border-radius:inherit;transition:width .35s}
.bar.thin{height:5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-size:14.5px;font-weight:600;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.dash{border-style:dashed;border-color:var(--line-2)}
.chip.warn{border-color:transparent;color:var(--danger);background:var(--danger-bg)}
.chip.on{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-line)}
.chip svg{color:var(--good)}
span.chip{cursor:default}
.whoami{background:var(--accent-soft);color:var(--ink);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.whoami h2{font-family:var(--f-display);font-weight:600;font-size:19px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding-inline:6px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow-sm)}
.pick.plain{padding-inline-start:14px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}

/* Tabs */
.tabs-band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.tabs-band .wrap{padding-block:12px 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm)}
.tabs.two{grid-template-columns:repeat(2,1fr)}
.tabs.four{grid-template-columns:repeat(4,1fr);gap:3px}
.tabs.four button{font-size:13px;padding-inline:2px}
.home .tabs.four button{font-size:15.5px}
.tabs.five{grid-template-columns:repeat(5,1fr);gap:2px;padding:4px}
.tabs.five button{font-size:13px;padding-inline:1px;min-height:54px;border-radius:15px;white-space:nowrap}
.tabs.five button svg{width:20px;height:20px}
.meals-edit{margin-inline-start:auto}
.meal-day{display:flex;flex-direction:column;gap:10px}
.meal-day+.meal-day{margin-top:18px}
.meal-day-h{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.meal{background:var(--bg);border-radius:var(--r-md);padding:10px 12px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.meal-t{margin:0;font-size:15.5px;font-weight:700}
.meal-h .btn.sm{min-height:32px;padding:0 12px;font-size:14px}
.add-dish{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:999px;color:var(--accent-deep);font-weight:700;font-size:14.5px}
.add-dish:hover{background:var(--accent-soft)}
.add-dish:active{transform:scale(.95)}
.dishes{list-style:none;margin:6px 0 0;padding:0}
.dish{display:flex;align-items:center;gap:10px;padding-block:8px}
.dish-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start}
.dish-name{font-weight:700;font-size:16px}
.dish-items{font-size:13px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish .who{flex:none}
.dish .btn.sm{flex:none;min-height:32px;padding:0 12px;font-size:14px}
.meal-grid{display:flex;flex-direction:column;gap:10px}
.mg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mg-day{font-weight:700;font-size:15px}
.mg-slots{display:flex;gap:6px}
.mg-chip{position:relative}
.mg-chip input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.mg-chip span{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600;font-size:15px;cursor:pointer}
.mg-chip input:checked+span{background:var(--accent);color:var(--accent-ink)}
.mg-chip input:focus-visible+span{outline:2.5px solid var(--ring)}
.dish-ideas{margin-top:-4px}
.bchip.on{border-style:solid;background:var(--accent)}
button.gchip small{font-size:12.5px;font-weight:600;opacity:.65;margin-inline-start:5px}
.cat-pill.dish-pill{gap:6px;background:var(--accent-soft);color:var(--accent-ink)}
.dish-pill svg{width:15px;height:15px;flex:none}
.cat-pill.dish-pill small{font-weight:500;opacity:.7;font-size:12.5px}
span.item-main{cursor:default}
.dish-miss{font-size:12.5px;font-weight:600;color:var(--accent-deep);line-height:1.35}
/* "אני מביא": one plain list, like the ingredients page — the sheet scrolls, not a box inside it.
   A row: the check and the name; at its end how many (when counted) and where it goes — to buy, or I have it. */
.tk-list{display:flex;flex-direction:column}
.tk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"tk dest";align-items:center;column-gap:8px;row-gap:6px;padding-block:6px;border-bottom:1px solid var(--line)}
.tk-row.has-q{grid-template-areas:"tk q" "tk dest"}
.tk-row>.tk{grid-area:tk;min-width:0}
.tk-row>.tk.taken{grid-column:1/-1}
.tk-q{grid-area:q;justify-self:end;display:flex;align-items:center;gap:6px}
.tk-dest{grid-area:dest;justify-self:end;display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--sunk)}
.tk-row:has(input[name="tk"]:not(:checked)) :is(.tk-dest,.tk-q){display:none}
.tk-dest label{position:relative;cursor:pointer}
.tk-dest input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.tk-dest span{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tk-dest svg{width:14px;height:14px}
.tk-dest input:checked+span{background:var(--good-bg);color:var(--good);box-shadow:0 1px 2px rgba(60,52,90,.08)}
.tk-dest label:last-child input:checked+span{background:var(--mine-bg);color:var(--mine-ink)}
.tk-dest input:focus-visible+span{outline:2.5px solid var(--ring)}
.tk-q .mstep{min-height:34px}
#sheet-root .mstep input{min-height:0;height:auto}
.tk-q .mstep button{width:30px;font-size:18px}
.tk-q .mstep input{width:32px}
.tk-of{min-width:50px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
/* A dish's ingredients: a plain list (name, amount in a small pill, ×) and one more row in the same columns to add to it */
.dish-ings{display:flex;flex-direction:column}
.ding-row,.ding-add{display:grid;grid-template-columns:minmax(0,1fr) 80px 34px;align-items:center;column-gap:8px}
.ding-row{min-height:48px;border-bottom:1px solid var(--line)}
.ding-n{min-width:0;font-weight:600;font-size:16px;overflow-wrap:anywhere}
#dd-items .ding-a,.sheet #dd-amt{min-height:36px;height:36px;padding:0 6px;border-radius:12px;font-size:15px;font-weight:700;text-align:center;background:var(--sunk);border:1.5px solid transparent;color:var(--ink)}
.ding-a::placeholder,#dd-amt::placeholder{color:var(--muted);font-weight:600}
#dd-items .ding-a::placeholder{opacity:.5}
#dd-items .ding-a:disabled{opacity:.6}
#dd-items .ding-a:focus,.sheet #dd-amt:focus{background:var(--surface);border-color:var(--ring)}
.ding-x{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.ding-x:hover{background:var(--danger-bg);color:var(--danger)}
.ding-x .ic,.ding-x svg{width:14px;height:14px}
.ding-add{padding-top:12px}
.sheet .ding-add #dd-new{min-height:46px;border-radius:14px;background:var(--accent-soft);border:1.5px solid var(--accent-line);font-weight:600}
.ding-add #dd-new::placeholder{color:var(--accent-deep);opacity:.75}
.ding-add #dd-new:focus{background:var(--surface);border-color:var(--ring)}
.sheet .ding-add #dd-amt{height:46px;min-height:46px;border-radius:14px}
.tk-q .mstep{background:var(--accent-soft);border-color:var(--accent-line)}
.tk-q .mstep input{font-weight:700;color:var(--accent-ink)}
.dish-shop{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border-radius:999px;background:var(--good-bg);color:var(--good);font-size:14px}
.dish-shop svg{width:17px;height:17px}
.tk{display:flex;align-items:center;gap:12px;min-height:40px;padding:2px;cursor:pointer}
.tk input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.tk-box{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;background:var(--surface)}
.tk input:checked+.tk-box{background:var(--good-bg);border-color:var(--good-fill);color:var(--good)}
.tk input:focus-visible+.tk-box{outline:2.5px solid var(--ring)}
.tk-n{flex:1;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.tk-n small{font-size:13px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.tk.taken{cursor:default;color:var(--muted)}
.tk.taken small{margin-inline-start:auto;font-weight:600}
.tabs button{min-height:42px;border-radius:17px;font-family:var(--f-display);font-weight:500;font-size:14.5px;line-height:1.15;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);padding-inline:4px;transition:background .18s,color .18s}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.tabs:not(.two) button{flex-direction:column;gap:4px;min-height:54px;font-size:14px}
.tabs button svg{width:21px;height:21px;flex:none}
.tabs .count{font-variant-numeric:tabular-nums;font-weight:400;font-size:13.5px}
@media (min-width:960px){.tabs-band{display:none}}

/* Board */
.board{display:grid;gap:20px;padding-block:8px 96px}
@media (max-width:959px){.col:not(.on){display:none}.col .col-head .label{display:none}}
@media (min-width:960px){.board{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:24px;padding-top:20px}#col-group{grid-row:1/span 3}}
.board.solo-board{max-width:780px;grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fold-row{display:flex;align-items:flex-start;gap:8px}
.fold-row>.addfold,.fold-row>form{flex:1;min-width:0}
.fold-row>.srch-wrap{flex:none}
@media (max-width:959px){#col-mine>.col-panel>.col-head{display:none}}
.col-head>.label{flex:1 1 100%}
.col-head>.search{flex:1 1 220px}
.viewbar{flex:1 1 220px;display:flex;align-items:center;gap:8px;min-width:0}
.view-lbl{font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.viewbar .seg{flex:1;display:flex;align-self:stretch}
.viewbar .seg button{flex:1;padding-inline:8px}
.viewbar .seg:empty{display:none}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm)}
.col-panel{display:flex;flex-direction:column;gap:14px}
.prog-slot:empty{display:none}
.tabs button{position:relative}
.badge{position:absolute;top:5px;inset-inline-end:calc(50% - 25px);min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--danger);color:#FFFFFF;box-shadow:0 0 0 2px var(--surface);font:700 11.5px/19px var(--f-body);text-align:center;font-variant-numeric:tabular-nums}
.badge.in{position:static;display:inline-block;box-shadow:none;margin-inline-start:2px}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs.six{grid-template-columns:repeat(6,1fr);gap:2px;padding:3px}
.tabs.six button{font-size:12.5px;padding-inline:0;min-height:54px;border-radius:15px;gap:3px;white-space:nowrap}
.tabs.six button svg{width:19px;height:19px}
.col-top .tab-note{margin:0}
.notes-wrap{display:flex;flex-direction:column;gap:12px}
.notes-wrap .seg{align-self:flex-start}
.note-vis button{display:inline-flex;align-items:center;gap:6px}
.note-vis svg{width:15px;height:15px;flex:none}
.note-msg{padding:12px 14px;border-radius:var(--r-lg);background:var(--sunk)}
.note-msg.mine{background:var(--mine-bg)}
.note-msg .you{margin-inline-start:6px}
.note-msg header{position:relative}
.msg-del{display:inline-grid;place-items:center;width:34px;height:34px;margin:-8px -8px -8px -6px;border-radius:50%;color:var(--muted)}
.msg-del:hover{color:var(--danger);background:var(--danger-bg)}
.msg-del .ic{width:17px;height:17px}
.note-msg header time{margin-inline-start:auto}
.chat-send{display:flex;align-items:flex-end;gap:8px}
.chat-send textarea{flex:1;min-width:0;display:block;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);background:#FFFBEC;border:1.5px solid var(--accent-line);border-radius:var(--r-md);min-height:48px;max-height:168px;padding:11px 14px;resize:none;overflow-y:auto}
.chat-send textarea::placeholder{color:var(--muted);opacity:.9}
.chat-send textarea:focus{outline:none;border-color:var(--ring);background:var(--surface)}
.chat-send .send{flex:none;width:48px;height:48px;padding:0;border-radius:50%}
.chat-send .send svg{width:21px;height:21px;transform:scaleX(-1)}
.chat-list{display:flex;flex-direction:column;gap:10px}
.note-msg header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.note-msg header b{font-size:14.5px}
.note-msg time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note-msg-t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.55}
.note-msg-t a{color:var(--link);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.note-view,.note-ta{display:block;width:100%;min-height:42vh;box-sizing:border-box;padding:18px 18px 28px;border-radius:var(--r-lg);background:#FFFBEC;box-shadow:inset 0 0 0 1px #F6E7B8;font:400 16.5px/1.65 var(--f-body);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;text-align:start}
.note-view{cursor:text}
.note-view.empty{color:var(--muted)}
.note-view a{color:var(--link);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.note-ta{border:0;resize:none;outline:none}
.note-ta:focus{box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.buy-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* Sheets: tighter, so a whole form fits on one screen */
.sheet .stack-form{gap:10px}
.sheet .field{gap:5px}
.sheet input:not([type=radio]):not([type=checkbox]):not([type=hidden]),.sheet select{min-height:44px}
.sheet .add-row .grow{flex:1 1 0}
.sheet .add-row .btn{min-height:44px;padding:0 16px}
.sheet .sheet-title{font-size:22px}
.sheet .sheet-tools{padding-top:10px}
.sheet .seg-radio span{min-height:36px;padding:0 14px}
.field.inl{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.field.inl>span{flex:none}
.field.inl select{flex:1;max-width:62%}
.date-sum{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:15px;color:var(--ink);text-align:start}
.date-sum svg{width:15px;height:15px;flex:none;color:var(--muted)}
.sheet .cal{padding:4px 8px 6px}
.sheet .cal-head{font-size:16px}
.sheet .cal-head .icon-btn{width:34px;height:34px}
.sheet .cal-grid{margin-top:2px}
.sheet .cal-dow{padding-block:2px;font-size:12px}
.sheet .cal-day{height:34px;font-size:15px;border-radius:10px}
.sheet .cal-foot{margin-top:2px;min-height:26px}
.sheet .swatches{gap:10px}
.sheet .sw span{width:34px;height:34px}
.ask-buy{margin:-6px 0 4px;color:var(--muted);font-weight:600}
.tag.buy{background:var(--accent-soft);color:var(--accent-ink)}
.bank-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bank-top .btn.sm{min-height:34px;padding:0 14px;font-size:14px}
.bank-top{flex-wrap:wrap;row-gap:6px}
.bank-toggle span{white-space:nowrap}
.bank-tools{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.bank-edit{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 8px;color:var(--link);font-weight:700;font-size:14px}
.bank-edit svg{width:14px;height:14px}
.item.has-grip{grid-template-columns:auto minmax(0,1fr) auto}
.grip{grid-column:3;grid-row:1;align-self:center;display:grid;place-items:center;width:30px;height:36px;margin-inline-end:-6px;color:var(--muted);opacity:.55;touch-action:none;cursor:grab}
.item.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:90;margin:0;list-style:none;pointer-events:none;background:var(--surface);border-top:0;border-radius:14px;padding-inline:12px;box-shadow:var(--shadow);transform:scale(1.02)}
.drop-line{position:fixed;z-index:89;display:none;height:3px;border-radius:3px;background:var(--accent-deep);pointer-events:none}
.lane.drop-on{box-shadow:0 0 0 2px var(--accent-line),var(--shadow-sm)}
body.is-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.miss-lane{padding-top:6px}
.af-head{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding-inline:8px 14px;border-radius:16px;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:15.5px;text-align:start}
.af-plus{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:21px;font-weight:600;line-height:1}
.af-head svg{margin-inline-start:auto;color:var(--muted);transform:rotate(90deg);transition:transform .25s}
.addfold.open .af-head svg{transform:none}
.af-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.addfold.open .af-body{grid-template-rows:1fr}
.af-in{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:3px;margin:-3px;visibility:hidden;transition:visibility 0s .3s}
.addfold.open .af-in{visibility:visible;transition-delay:0s}
.af-in>:first-child{margin-top:0}
.add-one{flex-wrap:wrap;align-items:center}
.add-one .grow{flex:1 1 100%;min-width:0;min-height:50px;border-radius:16px;padding-inline:16px;background:var(--accent-soft);border:1.5px solid var(--accent-line);font-weight:600}
.add-one .grow::placeholder{color:var(--accent-deep);opacity:.75;font-weight:600}
.add-one .grow:focus{background:var(--surface);border-color:var(--ring)}

/* Item bank and suggestions */
.bank{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:var(--r-md);padding:10px 12px}
.bank-toggle{display:flex;align-items:center;gap:8px;min-height:34px;font-weight:600;color:var(--muted);text-align:start}
.bank-toggle svg{transition:transform .15s}
.bank-toggle[aria-expanded="false"] svg{transform:rotate(90deg)}
.bank-cat{display:flex;align-items:flex-start;gap:10px}
.bank-cat .blaze{margin-top:12px}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:inline-flex;align-items:center;gap:4px;min-height:34px;padding-inline:12px;border-radius:999px;border:1px dashed var(--accent-line);font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink)}
.bchip:hover{border-style:solid;border-color:var(--accent-line);background:var(--accent)}

/* Categories and items: a category is a tinted rounded label in the display face; items are plain body text */
.cat{display:flex;flex-direction:column}
.cat+.cat{margin-top:22px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:9px;padding-bottom:8px}
.cat-pill{display:inline-flex;align-items:center;gap:7px;min-width:0;padding:4px 12px 4px 11px;border-radius:999px;background:var(--sunk);background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink);color:color-mix(in srgb,var(--c) 38%,var(--ink))}
.cat-pill h3,.cat-pill>span:last-child{font-family:var(--f-display);font-weight:600;font-size:14.5px;letter-spacing:.02em;line-height:1.2;overflow-wrap:anywhere}
.cat-count{font-family:var(--f-display);font-weight:500;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-ic{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;font-size:16px;line-height:1}
.items{list-style:none;margin:0;padding:0}
.items>.item+.item,.dishes>.dish+.dish{border-top:1px solid #F3F1F7}
.items>.item.cat-add{border-top:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center;padding-block:7px}
.item.has-del{grid-template-columns:auto minmax(0,1fr) auto}
.item-main{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;text-align:start;min-height:30px;padding:2px 0}
.item-name{font-family:var(--f-body);font-weight:500;font-size:17px;overflow-wrap:anywhere}
.qty{font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty b{color:var(--ink)}
.item.covered .item-name{color:var(--muted)}
.row-del{grid-column:3;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--muted);opacity:.4}
.row-del:hover,.row-del:focus-visible{opacity:1;background:var(--sunk)}
.cat-add{border-top:0;padding-top:4px}
.add-more{display:inline-flex;align-items:center;min-height:32px;padding-inline:2px;color:var(--muted);font-weight:600;font-size:14.5px}
.add-more:hover{color:var(--link)}
.parts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.item.has-parts{grid-template-columns:auto minmax(0,1fr) auto}
.item.has-parts .parts{grid-column:3;grid-row:1;justify-content:flex-end;align-self:center;padding-top:0;max-width:min(58vw,300px)}
.item .who,.dish .who{min-height:23px;gap:3px;padding-block:1px;padding-inline:2px 8px;font-size:12.5px}
.item .who .av,.dish .who .av{width:16px;height:16px;font-size:9.5px}
.item .who svg{width:12px;height:12px}
.item .who.also{padding-inline:8px}
.item .who-name{max-width:12ch}
.item.many-parts{grid-template-columns:auto minmax(0,1fr)}
.item.many-parts .parts{grid-column:2;grid-row:2;max-width:none;padding-top:5px;gap:5px}
.who{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:30px;padding-block:2px;padding-inline:4px 10px;border-radius:999px;background:var(--sunk);font-size:14px;font-weight:600}
.who.mine{background:var(--mine-bg);color:var(--mine-ink)}
.who-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:16ch}
.who-q{font-variant-numeric:tabular-nums;opacity:.75;font-weight:600}
.who svg{color:var(--good)}
.who.also{background:transparent;border:1.5px dashed var(--accent-line);color:var(--accent-deep);padding-inline:10px}
.who.also:hover{background:var(--accent-soft)}
.qty-tot{color:var(--muted);font-weight:500}
.multi-row{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600;font-size:15.5px;cursor:pointer}
.multi-row input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.multi-sw{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line-2);transition:background .15s}
.multi-sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .15s}
.multi-row input:checked+.multi-sw{background:var(--good-fill)}
.multi-row input:checked+.multi-sw::after{transform:translateX(-18px)}
.multi-row input:focus-visible+.multi-sw{outline:2.5px solid var(--ring);outline-offset:2px}
.cbox{grid-row:span 2;align-self:start;margin-top:2px;width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--surface);color:var(--good);transition:background .12s,border-color .12s}
.cbox:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.cbox,.pk{transition:background .12s,border-color .12s,transform .14s cubic-bezier(.3,.7,.4,1.6)}
.cbox:active:not(:disabled),.pk:active:not(:disabled){transform:scale(.84)}
.cbox.on{background:var(--good-bg);border-color:var(--good-fill);color:var(--good)}
.cbox.ghost{border-style:dashed;background:transparent}
.cbox:disabled:not(.on){opacity:.45}
.pk{grid-row:span 2;align-self:start;margin-top:2px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;transition:background .12s}
.pk.on{background:var(--good-bg);border-color:var(--good-fill);color:var(--good)}
.pk:disabled:not(.on){opacity:.45}
.new-dot{display:inline-block;width:9px;height:9px;margin-inline-start:8px;vertical-align:2px;border-radius:50%;background:#4F79C9;box-shadow:0 0 0 3.5px rgba(79,121,201,.2);animation:newdot 10s linear forwards}
@keyframes newdot{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.new-dot{animation-timing-function:steps(1,end)}}
.item.packed .item-name{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.flag{font-weight:700;font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--danger-bg);color:var(--danger)}
.tag{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:1px 8px}
.empty-in{padding:14px 2px;color:var(--muted)}
.empty-in.done{color:var(--good);font-weight:700}
.srch-wrap{display:inline-flex;align-items:center;flex:0 0 auto;min-height:46px;border-radius:999px;background:var(--sunk);color:var(--ink);transition:background .15s}
.srch-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;height:46px;padding-inline:13px;border-radius:999px;color:inherit}
.srch-q{max-width:8ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14.5px}
.srch-wrap:not(.on) .srch-q,.srch-wrap:not(.on) .srch-x{display:none}
.srch-wrap.on{background:var(--accent-soft);color:var(--accent-ink)}
.srch-wrap.on .srch-btn{padding-inline-end:4px}
.srch-x{width:30px;height:30px;margin-inline-end:8px;border-radius:50%;display:grid;place-items:center;color:inherit;opacity:.75}
.col-head>.srch-wrap{margin-inline-start:auto}
.spop{position:fixed;inset:0;z-index:65;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(22vh + env(safe-area-inset-top,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.spop-back{position:absolute;inset:0;background:rgba(43,40,51,.1);animation:fade-in .18s ease}
.spop-card{position:relative;width:min(340px,100%);display:flex;align-items:center;padding:4px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line),var(--shadow);animation:pop-in .22s cubic-bezier(.2,.8,.2,1)}
.spop-card .search-ic{position:static;padding-inline:12px 4px;display:flex;color:var(--muted)}
.spop-card input.search-in{flex:1;min-height:46px;padding-inline:4px 10px;background:transparent;border-color:transparent;border-radius:999px}
.spop-card .search-x{position:static;width:34px;height:34px;flex:none}
.spop.out .spop-card{opacity:0;transform:translateY(-6px) scale(.97);transition:opacity .16s,transform .16s}
.spop.out .spop-back{opacity:0;transition:opacity .16s}
@keyframes pop-in{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
.search{position:relative;min-width:0;display:flex;align-items:center}
.search-ic{position:absolute;inset-inline-start:13px;color:var(--muted);display:flex;pointer-events:none}
input.search-in{min-height:40px;border-radius:999px;padding-inline:38px 38px;-webkit-appearance:none;appearance:none}
.search-in::-webkit-search-cancel-button,.search-in::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search-x{position:absolute;inset-inline-end:5px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.lane-cat{display:flex;flex-direction:column;margin-top:12px}
.lane-cat .cat-pill{align-self:flex-start;padding-block:3px}
.lane-cat .cat-pill>span:last-child{font-size:13.5px}
.trip-card.themed .stub{background:rgba(255,255,255,.6);color:inherit}
.trip-card.themed :is(.trip-meta,.trip-when,.chev){color:inherit;opacity:.72}
.gear{width:42px;height:42px;color:var(--ink);background:rgba(255,255,255,.84);box-shadow:var(--shadow-sm);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top .share-btn{background:rgba(255,255,255,.84);color:var(--ink)}
.share-btn svg{width:20px;height:20px}
.page-h{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,7vw,38px)}
.set-sec{display:flex;flex-direction:column;gap:10px}
.set-sec>.col-top{min-height:58px;padding:4px 16px 4px 10px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm)}
.set-sec .sec-fold{flex:1;justify-content:space-between;min-height:50px}
.set-sec .col-top h2{font-size:18px}
.sec-t{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start}
.sec-t small{font-size:13.5px;font-weight:500;color:var(--muted)}
.set-hint{margin:-2px 4px 0;font-size:14px;color:var(--muted)}
.page{gap:16px}
.set-list{display:flex;flex-direction:column;padding:4px 8px}
.set-row{display:flex;align-items:center;gap:4px;min-height:54px;border-top:1px solid var(--line)}
.set-list>.set-row:first-child{border-top:0}
.set-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:52px;padding-inline:8px;text-align:start}
button.set-row{width:100%;padding-inline:8px;text-align:start;gap:12px}
.set-label{flex:1;min-width:0;font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.set-val{color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums}
.set-row .icon-btn:disabled{opacity:.25}
.set-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;flex:none;background:var(--sunk);background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;--cc:#C4BFCF}
.emo{height:44px;border-radius:12px;font-size:22px;line-height:1;display:grid;place-items:center;background:var(--sunk)}
.emo .blaze{background:var(--cc)}
.emo.on{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel-line)}
.swb{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(43,40,51,.08)}
.swb.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ring)}
.li-chips{display:flex;flex-wrap:wrap;gap:6px}
.head-note{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:14px;font-weight:600;opacity:.78}
.private-note{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:4px 11px 4px 10px;border-radius:999px;background:var(--mine-bg);color:var(--mine-ink);font-size:13.5px;font-weight:600}

/* People */
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 8px;box-shadow:var(--shadow-sm)}
.lane.is-me{box-shadow:0 0 0 2px var(--mine-line),var(--shadow-sm)}
.lane-head{display:flex;align-items:center;gap:12px}
.lane-title{flex:1;min-width:0}
.lane-head[data-lane-fold]{cursor:pointer;border-radius:12px;outline-offset:4px}
.lane-chev{flex:none;display:grid;place-items:center;width:28px;height:28px;color:var(--muted);transition:transform .2s}
.lane-chev svg{width:18px;height:18px}

.lane.folded .lane-body{display:none}
.lane-title h3{font-family:var(--f-display);font-weight:600;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.lane-title p{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.you{font-family:var(--f-body);font-size:12.5px;font-weight:700;background:var(--mine-bg);color:var(--mine-ink);padding:2px 9px;border-radius:999px}
.lane .bar{margin:2px 0 2px}
/* a person's items hang under their name: set in, along a thread in their color */
.lane-body{margin-top:8px;margin-inline-start:20px;padding-inline-start:16px;border-inline-start:2.5px solid var(--line-2);border-inline-start-color:color-mix(in srgb,var(--gc,#8A8594) 34%,transparent)}
.lane-body .lane-cat:first-child{margin-top:6px}
.lane-body .lane-items{margin-top:2px}
.lane-body .lane-items>.item:first-child{border-top:0}
.lane-body .lane-empty{padding-top:4px}
.sub-label{margin-top:12px;font-size:13px}
.lane-empty{color:var(--muted);font-size:15px;padding:12px 0 8px}

/* Pickers inside sheets */
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{position:relative;display:block}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;margin:0;cursor:pointer}
.sw span{display:block;width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-2)}
.sw input:checked+span{box-shadow:inset 0 0 0 1px var(--line-2),0 0 0 3px var(--surface),0 0 0 5px var(--ring)}
.sw input:focus-visible+span{outline:2.5px solid var(--ring);outline-offset:4px}
.sw-photo span{display:grid;place-items:center;background:var(--sunk) center/cover no-repeat;color:var(--muted)}
.sw-photo span svg{width:18px;height:18px}
.sw-photo.on span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ring)}
.sw-photo.on span svg{display:none}
.bg-tools{display:flex;align-items:center;gap:6px;margin-top:2px}
.cal{border-radius:var(--r-lg);padding:8px 10px 10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.cal-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--f-display);font-weight:500;font-size:17px}
.cal-head b{font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:4px}
.cal-dow{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding-block:4px}
.cal-day{height:40px;border-radius:12px;font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums}
.cal-day:hover{background:var(--sunk)}
.cal-day.past{color:var(--muted)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.cal-day.mid{background:var(--accent-soft);border-radius:0}
.cal-day.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;margin-top:6px;font-size:14.5px;color:var(--muted)}
.added{display:flex;flex-wrap:wrap;gap:6px}
.in-l{animation:in-l .3s cubic-bezier(.2,.8,.2,1)}
.in-r{animation:in-r .3s cubic-bezier(.2,.8,.2,1)}
@keyframes in-l{from{opacity:0;transform:translateX(-40%)}to{opacity:1;transform:none}}
@keyframes in-r{from{opacity:0;transform:translateX(40%)}to{opacity:1;transform:none}}
.ch-row{display:flex;align-items:center;gap:10px;padding-block:6px;border-bottom:1px solid var(--line)}
.ch-row:last-child{border-bottom:0}
.ch-name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.ch-row select{width:auto;min-height:40px;flex:0 0 auto}

/* Money */
.money-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money-sum>div{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.money-sum>div+div{background:var(--sunk)}
.money-sum.one{grid-template-columns:1fr}
.money-sec+.money-sum,.money-sum+.money-sec,.money-sec+.money-sec{margin-top:18px}
.money-out{padding:12px 2px 2px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.5}
.money-sum .big{font-family:var(--f-display);font-weight:600;font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}
.money-sum small{color:var(--muted);font-size:13.5px;font-weight:600}
.money-sec{display:flex;flex-direction:column}
.money-sec>h3{font-family:var(--f-display);font-weight:500;font-size:16px;color:var(--muted);padding-bottom:4px}
.row{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.row-main small{color:var(--muted);font-size:14px}
button.row{width:100%;text-align:start}
.pill{font-weight:700;font-size:13.5px;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.plus{background:var(--good-bg);color:var(--good)}
.pill.minus{background:var(--danger-bg);color:var(--danger)}
.pill.zero{background:var(--sunk);color:var(--muted)}
.tr-who{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600}
.amt{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.undo-row{padding-top:10px;display:flex}
.undo-btn{gap:6px}
.among{display:flex;flex-wrap:wrap;gap:6px}
.chk{position:relative}
.chk input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chk span{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding-inline:4px 12px;border-radius:999px;border:1px solid var(--line);font-weight:600;cursor:pointer}
.chk input:checked+span{border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-ink)}
.chk input:not(:checked)+span{opacity:.5}
.chk input:focus-visible+span{outline:2.5px solid var(--ring)}

/* Templates */
.tpl-list{display:flex;flex-direction:column;gap:10px}
.tpl-row{--pis:16px;display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm)}
.tpl-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tpl-row b{font-family:var(--f-display);font-weight:600;font-size:18px}
.tpl-row small{color:var(--muted);font-size:14px}
.tpl-row .chev{padding:0}
.tpl-sec{display:flex;flex-direction:column;gap:8px}
.tpl-sec+.tpl-sec{margin-top:26px}
.tpl-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px}
.tpl-h .label{font-size:16px;font-weight:600;color:var(--ink)}
.tpl-sec>.add-one{margin-bottom:6px}
.tpl-item{grid-template-columns:minmax(0,1fr) auto}
.tpl-item .item-main{grid-column:1}
.title-input{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,6vw,32px);min-height:58px;background:var(--surface);box-shadow:var(--shadow-sm)}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-top h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,7vw,40px)}

/* Sheets */
#sheet-root{position:fixed;inset:0;z-index:60;display:none}
#sheet-root.open{display:block}
.sheet-back{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:0 -12px 40px -12px rgba(60,52,90,.22);display:flex;flex-direction:column;gap:16px}
.sheet-grip{flex:none;display:flex;justify-content:center;align-items:center;height:26px;margin-top:-10px;margin-bottom:-8px;margin-inline:-18px;touch-action:none;cursor:grab}

/* New in the shared list: what someone else added since I last had this event open, or while I'm in it.
   A blue dot sits by it for 10 seconds from when it is first on screen, fading at the end. */
const NEW_MS = 10000;
let newDots = {}, knownItems = null, newBase = 0;
function startNewDots(id) { newDots = {}; knownItems = null; newBase = Number(lsGet('iseen:' + id)) || 0; }
function trackNewItems() {
  const me = myKey(), first = !knownItems;
  if (first) knownItems = new Set();
  S.items.forEach(i => {
    if (knownItems.has(i.id)) return;
    knownItems.add(i.id);
    if (i.scope === 'p' || (i.src && i.src !== i.id) || i.by === me) return;  // personal items, a share split off a line, my own
    if (!first || (newBase && (Number(i.created) || 0) > newBase)) newDots[i.id] = 0;  // 0: waiting to be seen
  });
  lsSet('iseen:' + S.tripId, String(Date.now()));
}
function newDot(items) {
  const vis = S.tab === 'group' || window.innerWidth >= 960, now = Date.now();
  for (const it of items) {
    if (!it || !(it.id in newDots)) continue;
    if (!newDots[it.id]) { if (!vis) return ''; newDots[it.id] = now; setTimeout(() => render(), NEW_MS + 80); }
    const age = now - newDots[it.id];
    if (age >= NEW_MS) { delete newDots[it.id]; continue; }
    return '<i class="new-dot" style="animation-delay:-' + age + 'ms" role="img" aria-label="חדש" title="חדש"></i>';
  }
  return '';
}

function startClaim(itemId) {
  if (S.readOnly) return;
  const it = S.items.find(i => i.id === itemId); if (!it) return;
  if (!needMe(() => startClaim(itemId))) return;

async function claimMeat(key, gid, type, grams, people) {
  sfx('check');
  const T = tripData(), L = T.lines.find(l => l.key === key), g = T.gmap[gid]; if (!L || !g) return;
  const mine = L.parts.find(p => p.owner === gid && (p.detail || '') === type);

    else { const id = uid('i'); await Store.set(itemPath(id), itemDoc({name: L.name, cat: 'food', qty: 1, scope: 'g', owner: gid, src: key, detail: type, grams, created: (L.ref.created || Date.now()) + 0.001}, id)); }
    toast(fmtG(grams) + ' ' + (type || L.name) + ' ברשימה ' + whoseList(gid));
  } catch (e) {}
}
async function claim(itemId, n, gid, extra) {
  sfx('check');
  const trip = S.tripId, path = 'events/' + trip + '/items/' + itemId;
  const T = tripData(), g = T.gmap[gid]; if (!g) return;
  const detail = ((extra && extra.detail) || '').trim();
  let cur;
  try {
    if (!(await Store.lock(path))) { toast('מישהו אחר מסמן את זה עכשיו. נסו שוב.'); return; }
    cur = await Store.get(path);
  } catch (e) { return; }
  if (!cur) { toast('הפריט נמחק'); return; }
  if (cur.owner && T.gmap[cur.owner]) { toast(cur.owner === gid ? 'כבר ברשימה שלך' : 'כבר ברשימה של ' + T.gmap[cur.owner].name); return; }
  const have = Q(cur), take = Math.min(have, clampQ(n)), src = cur.src || cur.id;
  const mine = S.items.find(i => i.id !== cur.id && i.scope !== 'p' && i.owner === gid && (i.src || i.id) === src && (i.detail || '') === detail);
  const label = dispName({name: cur.name, detail});
  let myId = null, msg = '';
  try {
    if (take >= have) {
      if (mine) { await Store.update(itemPath(mine.id), {qty: Q(mine) + take, packed: false}); await Store.del(path); myId = mine.id; }
      else { await Store.update(path, Object.assign({owner: gid, packed: false, buy: false, bought: false, src, qty: have}, detail ? {detail} : {})); myId = itemId; }
      msg = label + ' ברשימה ' + whoseList(gid);
    } else {
      await Store.update(path, {qty: have - take, src});
      if (mine) { await Store.update(itemPath(mine.id), {qty: Q(mine) + take, packed: false}); myId = mine.id; }
      else { const id = uid('i'); await Store.set(itemPath(id), itemDoc({name: cur.name, cat: catOf(cur), qty: take, unit: cur.unit || '', scope: 'g', owner: gid, src, detail, created: (cur.created || Date.now()) + 0.001}, id)); myId = id; }
      msg = label + ': ' + take + ' ברשימה ' + whoseList(gid) + ' · חסרים ' + (have - take);
    }
  } catch (e) { return; }
  if (msg) toast(msg);
}

async function putBack(itemId, quiet) {
  if (!quiet) sfx('uncheck');
  const trip = S.tripId, T = tripData(), it = S.items.find(i => i.id === itemId); if (!it) return;
  const path = 'events/' + trip + '/items/' + it.id, k = kindOf(it);
  try {
    if (k === 'meat' && (it.src || it.id) !== it.id) { await Store.del(path); if (!quiet) toast(dispName(it) + ' הוסר'); return; }
    if (it.scope === 'p') await Store.update(path, {scope: 'g', owner: null, packed: false});
    else if (it.extra) { await Store.del(path); if (!quiet) toast(dispName(it) + ' הוסר מהרשימה שלך'); return; }
    else {
      const src = it.src || it.id;
      const open = S.items.find(i => i.id !== it.id && i.scope !== 'p' && !T.owned(i) && (i.src || i.id) === src);
      if (open) { await Store.update(itemPath(open.id), {qty: Q(open) + Q(it)}); await Store.del(path); }
      else await Store.update(path, {owner: null, packed: false, buy: false, bought: false});
    }
    if (!quiet) toast(dispName(it) + ' חזר לרשימה המשותפת');
  } catch (e) {}
}

/* Adding to the shared list: meat, salad, soft drinks and six-pack drinks open a dialog first */
function addGroupFlow(name, qty, cat, unit, owner) {
  if (dupGroup(name)) { dupToast(name); return false; }
  const addItem = d => {  // "אני אביא": the new item goes straight onto that person's list in "מי מביא מה"
    if (!owner) return addItemDoc(d);
    toast(dispName(d) + ' ברשימה ' + whoseList(owner)); return addItemDoc(Object.assign(d, {owner}));
  };
  const T = tripData(), k = kindOfName(name);
  if (k === 'meat') {
    const preset = meatPreset(name), generic = meatType(name) === 'בשר' ? name : 'בשר', done = new Set();
    openMeatSheet({title: name, preset, generic, grams: 500, people: T.meatPeople, others: T.meatTotal, cta: 'הוספה', onSave: (type, g, people) => {
      saveMeatPeople(people);
      const nm = type || generic;
      if (done.has(norm(nm)) || dupGroup(nm)) { dupToast(nm); return false; }
      done.add(norm(nm));
      addItem({name: nm, cat: 'food', qty: 1, grams: g, scope: 'g'});
    }});
    return true;
  }
  if ((k === 'salad' && saladGeneric(name)) || k === 'soft') {
    const salad = k === 'salad';
    openChoiceSheet({title: salad ? 'איזה סלט?' : 'איזו שתייה קלה?', ideas: salad ? SALAD_IDEAS : SOFT_IDEAS, multi: true, qty: !salad, onSave: rows => {
      rows.forEach((r, i) => { const nm = salad ? saladName(r.name) : r.name; if (dupGroup(nm)) { dupToast(nm); return; } addItem(Object.assign(applyDefaults({name: nm, cat: salad ? 'food' : 'drinks', qty: r.qty, unit: r.unit, scope: 'g'}), {created: Date.now() + i})); });
    }});
    return true;
  }
  if ((k === 'six' || k === 'ice') && qty === 1) {
    openSixSheet(name, (n, u) => addItem(applyDefaults({name, cat, qty: n, unit: u, scope: 'g'})), 1, k === 'ice' ? BAG : undefined);
    return true;
  }
  addItem(applyDefaults({name, cat, qty, unit, scope: 'g'}));
  return true;
}
// Every suggestion at once. Ones that need a choice first (which meat and how much, which salad or drink) stay behind.
function bankAddAll() {
  const T = tripData(); if (!T.ev || S.readOnly) return;
  const all = evSugg(T.ev);
  const pick = [], now = Date.now(); let held = 0;
  all.forEach(b => {
    if (!b.name || pick.some(x => same(x.name, b.name)) || dupGroup(b.name)) return;
    if (generator(b) || kindOfName(b.name) === 'meat') { held++; return; }
    pick.push(applyDefaults({name: b.name, cat: CAT[b.cat] ? b.cat : guessCat(b.name), qty: Q(b), unit: b.unit || undefined, scope: 'g', created: now + pick.length}));
  });
  if (!pick.length) { if (held) toast('ההצעות שנשארו דורשות בחירה'); return; }
  sfx('add');
  fire(runLimited(pick.map(d => () => { const id = uid('i'); return Store.set(itemPath(id), itemDoc(d, id)); }), 4));
  toast('נוספו ' + pick.length + ' פריטים' + (held ? ' · ' + held + ' דורשים בחירה' : ''));
}
function soloAddAll() {
  if (!soloBase()) return;
  const T = S.view === 'trip' ? tripData() : null;
  const ess = ((T && T.ev && T.ev.essentials) || []).map(e => ({name: e.name, qty: Q(e), cat: CAT[e.cat] ? e.cat : null}));
  const list = [];
  ess.concat(myBankList().map(n => ({name: n, qty: 1}))).forEach(x => {
    if (!x.name || list.some(y => same(y.name, x.name)) || dupSolo(x.name)) return;
    list.push({name: x.name, qty: x.qty || 1, cat: x.cat || guessCat(x.name)});
  });
  if (!list.length) return;
  const now = Date.now();
  const write = base => runLimited(list.map((x, i) => () => { const id = uid('i'); return Store.set(base + '/items/' + id, itemDoc({name: x.name, cat: x.cat, qty: x.qty, created: now + i}, id)); }), 4);
  sfx('add');
  if (S.view === 'trip' && !S.soloId) fire(ensureTripSolo(true).then(lid => lid ? write(soloBase() + '/' + lid) : null));
  else fire(write(soloBase() + '/' + S.soloId));
  toast('נוספו ' + list.length + ' פריטים');
}
function bankAdd(b) {
  const name = b.name, cat = CAT[b.cat] ? b.cat : 'general', k = kindOfName(name), q = Q(b), unit = b.unit || '';
  if (k === 'meat' || k === 'salad' || k === 'soft') return addGroupFlow(name, q, cat, unit);
  if (dupGroup(name)) { dupToast(name); return; }
  const mu = typeof b.multi === 'boolean' ? {multi: b.multi} : {};
  if (k === 'six' || k === 'ice') return openSixSheet(name, (n, u) => addItem(Object.assign(applyDefaults({name, cat, qty: n, unit: u, scope: 'g'}), mu)), q, k === 'ice' ? BAG : SIX);
  if (q > 1 || unit) return openAddQtySheet(name, q, unit, n => addItem(Object.assign({name, cat, qty: n, unit, scope: 'g'}, mu)));
  addItem(Object.assign({name, cat, qty: q, unit, scope: 'g'}, mu));
}
/* Personal list mirror: items you add for yourself also land in your private list for this trip */
async function ensureTripSolo(quiet) {
  const b = soloBase(), ev = tripData().ev; if (!b || !ev) return null;
  const found = S.solos.find(l => l.tripId === ev.id); if (found) return found.id;
  if (tripSoloCache[ev.id]) return tripSoloCache[ev.id];
  const lid = uid('l'); tripSoloCache[ev.id] = lid;
  try { await Store.set(b + '/' + lid, {kind: 'list', name: ev.name || '', date: ev.date || '', end: ev.end || '', tripId: ev.id, created: Date.now()}); }
  catch (e) { delete tripSoloCache[ev.id]; return null; }
  if (!quiet) toast('נפתחה רשימה אישית: ' + (ev.name || ''));
  return lid;
}
async function mirrorToSolo(d) {
  if (!d.owner || d.owner !== S.me) return;
  const lid = await ensureTripSolo(); if (!lid) return;
  const b = soloBase(), col = b + '/' + lid + '/items', nm = d.detail && kindOfName(d.name) !== 'six' ? dispName(d) : d.name;
  const existing = await Store.list(col).catch(() => []);
  if (existing.some(i => same(i.name, nm))) return;
  const id = uid('i');
  fire(Store.set(col + '/' + id, itemDoc({name: nm, cat: d.cat, qty: d.qty, unit: d.unit, grams: d.grams}, id)));
}
function addPersonal(d) { addItem(d); fire(mirrorToSolo(d)); }
function addPersonalFlow(name, qty, who, cat) {
  if (dupPersonal(who, name)) { dupToast(name); return false; }
  if (dupGroup(name)) { dupToast(name, 'ברשימה המשותפת'); return false; }
  const T = tripData(), k = kindOfName(name);
  if (k === 'meat') {
    const preset = meatPreset(name), generic = meatType(name) === 'בשר' ? name : 'בשר', done = new Set();
    openMeatSheet({title: name, preset, generic, grams: 500, people: T.meatPeople, others: T.meatTotal, cta: 'הוספה', onSave: (type, g, people) => {
      saveMeatPeople(people);
      const nm = type || generic;
      if (done.has(norm(nm)) || dupPersonal(who, nm)) { dupToast(nm); return false; }
      done.add(norm(nm));
      addPersonal({name: nm, cat: 'food', qty: 1, scope: 'p', owner: who, grams: g});
    }});
    return true;
  }
  if ((k === 'salad' && saladGeneric(name)) || k === 'soft') {
    const salad = k === 'salad';
    openChoiceSheet({title: salad ? 'איזה סלט?' : 'איזו שתייה קלה?', ideas: salad ? SALAD_IDEAS : SOFT_IDEAS, multi: true, qty: !salad, onSave: rows => rows.forEach(r => { const nm = salad ? saladName(r.name) : r.name; if (!dupPersonal(who, nm)) addPersonal(applyDefaults({name: nm, cat: salad ? 'food' : 'drinks', qty: r.qty, unit: r.unit, scope: 'p', owner: who})); })});
    return true;
  }
  if ((k === 'six' || k === 'ice') && qty === 1) { openSixSheet(name, (n, u) => addPersonal(applyDefaults({name, cat: cat || 'drinks', qty: n, unit: u, scope: 'p', owner: who})), 1, k === 'ice' ? BAG : undefined); return true; }
  addPersonal(applyDefaults({name, cat: cat || guessCat(name), qty, scope: 'p', owner: who}));
  return true;
}
async function addGuest(name, makeMe) {
  const T = tripData(), ev = T.ev; if (!ev) return null;

  const trip = S.tripId, used = new Set(T.guests.map(g => Number(g.color)));

/* ---------- Misc ---------- */
function copyText(text, btn) {
  const done = () => { btn.textContent = 'הועתק'; setTimeout(() => { if (btn.isConnected) btn.textContent = 'העתקה'; }, 1800); };
  const fallback = () => { const el = byId('trip-code'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function confirmBtn(t) {
  if (t.dataset.armed) {
    const k = t.dataset.confirm, id = t.dataset.id;
    if (k !== 'remove-guest') sfx('delete');
    if (k === 'delete-trip') { closeSheet(); deleteTrip(); }
    else if (k === 'delete-solo') { closeSheet(); deleteSolo(); }
    else if (k === 'delete-split') { closeSheet(); const id = S.tripId; goHome(); dropEvent(id).then(ok => { if (ok) toast('נמחק'); }); }
    else if (k === 'delete-item') { closeSheet(); if (!foreign(S.items.find(i => i.id === id))) fire(Store.del(itemPath(id))); }
    else if (k === 'delete-solo-item') { closeSheet(); fire(Store.del(soloItemPath(id))); }
    else if (k === 'delete-dish') { closeSheet(); dishDraft = null; S.items.filter(i => i.dish === id && !i.owner).forEach(i => fire(Store.del(itemPath(i.id)))); fire(Store.del(dishPath(id))); }
    else if (k === 'delete-exp') {
      closeSheet(); const x = S.expenses.find(e => e.id === id);
      fire(Store.del(expPath(id)).then(() => { if (x) { const path = expPath(id), old = noId(x); pushUndo(() => Store.set(path, old)); } }));
    }
    else if (k === 'remove-guest') removeGuest(id);
    else if (k === 'sel-del') runSelDelete();
    else if (k === 'cat-del') { closeSheet(); saveCats(list => { const i = list.findIndex(c => c.id === id); if (i < 1) return false; list.splice(i, 1); }); }
    else if (k === 'ess-del') { closeSheet(); saveEss(arr => { arr.splice(Number(id), 1); }); }
    else if (k === 'tpl-delete') deleteTemplate();
    return;
  }
  t.dataset.armed = '1'; t.dataset.label = t.innerHTML; t.textContent = 'לחצו שוב לאישור'; t.classList.add('armed');
  setTimeout(() => { if (t.isConnected && t.dataset.armed) { delete t.dataset.armed; t.innerHTML = t.dataset.label; t.classList.remove('armed'); } }, 3500);
}
function act(a) {
  switch (a) {
    case 'home': return goHome();
    case 'templates': case 'settings': S.tplFrom = null; stopView(); S.view = 'settings'; S.tripId = null; S.soloId = null; S.q = ''; render(); window.scrollTo(0, 0); return;
    case 'new-cat': return openCatSheet(null);
    case 'sel-cancel': return exitSel();
    case 'sel-arch': return runSelArch();
    case 'archive': stopView(); Object.assign(S, {view: 'archive', fromArch: true, tripId: null, soloId: null, q: ''}); render(); window.scrollTo(0, 0); return;
    case 'arch-this': {  // from the edit sheet of an event or a list
      closeSheet();

  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('search-in')) { e.preventDefault(); closeSearch(); return; }
  if (e.key === 'Escape' && !byId('spop').hidden) { closeSearch(); return; }
  if (e.key === 'Escape' && byId('sheet-root').classList.contains('open')) { closeSheet(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if (t.id === 'tf-guest') { e.preventDefault(); ntAdd(); return; }
  if (t.id === 'eg-new') { e.preventDefault(); egAdd(); return; }
  if (t.id === 'dd-new') { e.preventDefault(); dishAddItem(); return; }
  // Enter in an item name adds it right away (a count can be typed with it: "עגבניות 6"); the field stays ready for the next
  const nx = t.dataset && t.dataset.next;
  if (nx) {
    e.preventDefault();
    if (!t.value.trim()) return;
    const f = t.form; if (f && f.requestSubmit) f.requestSubmit(); else if (f) f.dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}));
  }
});
// "have it / need to buy" takes effect the moment it is tapped
document.addEventListener('change', e => {
  const r = e.target; if (r.name !== 'it-buy') return;
  const f = r.closest('form[data-form="item"]'), it = f && S.items.find(i => i.id === f.dataset.id); if (!it || it.owner !== S.me) return;
  const buy = r.value === '1'; if (!!it.buy === buy) return;
  fire(Store.update(itemPath(it.id), {buy, bought: false}));
  toast(buy ? 'נוסף לקניות' : 'הוסר מהקניות');
});
document.addEventListener('change', e => {
  if (e.target.id === 'cover-file') { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) setCover(f); return; }
  if (e.target.id === 'snd') { lsSet('sound', e.target.checked ? 'on' : 'off'); if (e.target.checked) sfx('check'); return; }
  if (e.target.id === 'my-name') { const v = e.target.value.trim().slice(0, 40); lsSet('myName', v || null); if (v) toast('נשמר'); return; }
  if (e.target.id === 'tpl-name' && !S.readOnly) { const v = e.target.value.trim() || 'תבנית'; saveTpl(S.tplId, x => { x.name = v; }); }
  if (e.target.name === 'tf-mode') {
    const multi = e.target.value === 'multi', w = byId('tf-end-w'), l = byId('tf-date-l');
    if (w) w.hidden = !multi; if (l) l.textContent = multi ? 'מתאריך' : 'תאריך';
  }
});

/* ---------- Start ---------- */
async function init() {
  render();
  let db = null, user = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user, Assets] = await Promise.all([
        window.claude.use('db').catch(() => null),
        window.claude.use('user').catch(() => null),
        window.claude.use('assets').catch(() => null)
      ]);
    }
  } catch (e) {}
  if (db) {
    Store.db = db; S.mode = 'db';
    if (user) {
      try { S.canWrite = await user.can('data.write'); } catch (e) {}
      try { S.uid = await user.id(); } catch (e) {}
      try { const m = await user.me(); if (m && m.name) S.profileName = String(m.name).trim().split(/\s+/)[0]; } catch (e) {}
      if (S.canWrite === false) S.readOnly = true;
    }
  } else S.mode = 'local';
  Store.sub('events', l => {
    S.events = l; S.eventsLoaded = true;
    tryDeep(); render();
  });
  Store.sub('templates', l => { S.templates = l; S.templatesLoaded = true; seedStarterTpls(); render(); });
  Store.sub('settings', l => {
    const c = l.find(d => d.id === 'cats'), p = l.find(d => d.id === 'prefs'), lr = l.find(d => d.id === 'learn');
    setCats(c && c.list); setPrefs(p);
    LEARN = {}; if (lr && Array.isArray(lr.pairs)) lr.pairs.forEach(x => { if (Array.isArray(x) && typeof x[0] === 'string' && typeof x[1] === 'string') LEARN[x[0]] = x[1]; });
    const sd = l.find(d => d.id === 'seed'); S.seedTpl = sd ? Number(sd.tpl) || 0 : 0; S.settingsLoaded = true;
    seedStarterTpls(); render();
  });
  const b = soloBase();
  if (b) Store.sub(b, l => {
    S.solos = l.filter(d => d.kind === 'list'); S.shops = l.filter(d => d.kind === 'shop'); S.solosLoaded = true; S.notes = l.filter(d => d.kind === 'note');
    const ad = l.find(d => d.id === 'archive' && d.kind === 'archive'); if (ad) S.arch = cleanArch(ad.ev);
    const bk = l.find(d => d.id === 'bank' && d.kind === 'bank');
    S.myBank = bk && Array.isArray(bk.items) ? bk.items.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, 40)).slice(0, 80) : null;
    linkTripSolo(); linkTripShop(); if (!noteEdit) render();
  });
  render();
}
init();
})();
</script>
