# Publishes the app to Firebase Hosting (https://mimamoo-b37c7.firebaseapp.com) on every push.
# Google sign-in inside an iPhone home-screen app needs the app to be served from the
# Firebase address. Skips quietly until the FIREBASE_SERVICE_ACCOUNT secret is added.
name: Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set yet, nothing to publish"
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        name: Publish
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # a quick look at the key's shape (never its contents), so a wrong paste is easy to spot
          python3 - "$RUNNER_TEMP/sa.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          try:
              k = json.loads(raw)
              msg = "key: JSON ok, type=%s, project=%s, has client_email=%s, private_key looks right=%s, %d chars" % (
                  k.get("type"), k.get("project_id"), bool(k.get("client_email")),
                  str(k.get("private_key", "")).startswith("-----BEGIN PRIVATE KEY-----"), len(raw))
          except Exception as e:
              t = raw.strip()
              cls = lambda c: "quote" if c == '"' else "newline" if c == "\n" else "space" if c.isspace() else "letter/digit" if c.isalnum() else "U+%04X" % ord(c)
              pos = getattr(e, "pos", None)
              msg = ("key: not JSON: %s at line %s col %s (char there: %s), %d chars, %d lines, braces at ends=%s, "
                     "straight quotes=%d, curly quotes=%d, long dashes=%d, has PRIVATE KEY=%s, has client_email=%s" % (
                  getattr(e, "msg", type(e).__name__), getattr(e, "lineno", "?"), getattr(e, "colno", "?"),
                  cls(raw[pos]) if pos is not None and pos < len(raw) else "end", len(raw), raw.count("\n") + 1,
                  t[:1] == "{" and t[-1:] == "}", raw.count('"'), sum(raw.count(c) for c in "\u201c\u201d\u2018\u2019"),
                  sum(raw.count(c) for c in "\u2013\u2014"), "PRIVATE KEY" in raw, "client_email" in raw))
          print("::notice::" + msg)
          # a paste that wrapped long lines leaves raw line breaks inside the values: take them out again
          if not msg.startswith("key: JSON ok"):
              out, inside, esc, dropped = [], False, False, 0
              for c in raw:
                  if inside and c in "\r\n":
                      dropped += 1; continue
                  out.append(c)
                  if esc: esc = False
                  elif c == "\\": esc = inside
                  elif c == '"': inside = not inside
              try:
                  k = json.loads("".join(out))
                  import base64, re
                  body = re.sub(r"-----[A-Z ]+-----|\s", "", k.get("private_key", ""))
                  base64.b64decode(body, validate=True)
                  open(sys.argv[1], "w").write(json.dumps(k))
                  print("::notice::key repaired: removed %d line breaks inside values; the private key decodes" % dropped)
              except Exception as e:
                  print("::error::key could not be repaired (%s). Please paste it again." % type(e).__name__)
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only hosting --project mimamoo-b37c7 --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          rm -f "$RUNNER_TEMP/sa.json"
          cat "$RUNNER_TEMP/out.txt"
          # the error, readable from the run's summary as well
          if [ $code -ne 0 ]; then echo "::error::$(tail -c 2500 "$RUNNER_TEMP/out.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; fi
          exit $code
