# Publishes the app to Firebase Hosting (https://mimamoo-b37c7.firebaseapp.com) on every push.
# Google sign-in inside an iPhone home-screen app needs the app to be served from the
# Firebase address. Skips quietly until the FIREBASE_SERVICE_ACCOUNT secret is added.
name: Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set yet, nothing to publish"
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        name: Publish
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # a quick look at the key's shape (never its contents), so a wrong paste is easy to spot
          python3 - "$RUNNER_TEMP/sa.json" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          try:
              k = json.loads(raw)
              msg = "key: JSON ok, type=%s, project=%s, has client_email=%s, private_key looks right=%s, %d chars" % (
                  k.get("type"), k.get("project_id"), bool(k.get("client_email")),
                  str(k.get("private_key", "")).startswith("-----BEGIN PRIVATE KEY-----"), len(raw))
          except Exception as e:
              msg = "key: not JSON (%s), %d chars, starts with %r" % (type(e).__name__, len(raw), raw[:1])
          print("::notice::" + msg)
          PY
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only hosting --project mimamoo-b37c7 --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          rm -f "$RUNNER_TEMP/sa.json"
          cat "$RUNNER_TEMP/out.txt"
          # the error, readable from the run's summary as well
          if [ $code -ne 0 ]; then echo "::error::$(tail -c 2500 "$RUNNER_TEMP/out.txt" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; fi
          exit $code
